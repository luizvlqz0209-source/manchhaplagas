    <div class="overlay"></div>

    <main>
      <div class="brand-icon">
        <img src="assets/Molino.svg" alt="Molino ManchaPlagas">
      </div>

      <div class="eyebrow">Próximamente</div>
      
      <h1>
        MANCHAPLAGAS

          <button type="submit" id="submit-btn">Notificarme</button>

    <footer>
